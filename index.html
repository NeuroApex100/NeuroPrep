<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroPrep</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 0;
    text-align: center;
}

header {
    background: #1f4e79;
    color: white;
    padding: 25px;
}

.container {
    max-width: 700px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
}

button {
    padding: 12px 20px;
    margin: 8px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

.topic {
    display: block;
    width: 80%;
    margin: 12px auto;
    background: #1f4e79;
    color: white;
}

.option {
    display: block;
    width: 90%;
    margin: 10px auto;
    background: #eeeeee;
    text-align: right;
}

#submit {
    background: #1f4e79;
    color: white;
}

#result {
    margin-top: 20px;
    padding: 15px;
    background: #f1f1f1;
    border-radius: 10px;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<header>

<h1>🧠 NeuroPrep</h1>

<p>آمادگی آزمون نورولوژی</p>

</header>


<div class="container">

<!-- صفحه انتخاب مبحث -->

<div id="topics">

<h2>انتخاب مبحث</h2>

<button class="topic" onclick="startStroke()">
🧠 سکته مغزی
</button>

<button class="topic">
⚡ صرع
</button>

<button class="topic">
🦠 عفونی نورولوژی
</button>

<button class="topic">
🧬 MS و بیماری‌های دمیلینه‌کننده
</button>

</div>


<!-- صفحه سؤال Stroke -->

<div id="stroke" class="hidden">

<h2>🧠 Stroke</h2>

<p>
<strong>سؤال ۱</strong>
</p>

<h3>
در بیمار مشکوک به سکته مغزی ایسکمیک حاد،
مهم‌ترین بررسی تصویربرداری اولیه برای رد خونریزی
داخل جمجمه کدام است؟
</h3>

<button class="option" onclick="selectAnswer('A')">
A) MRI با کنتراست
</button>

<button class="option" onclick="selectAnswer('B')">
B) CT اسکن بدون کنتراست
</button>

<button class="option" onclick="selectAnswer('C')">
C) MRV
</button>

<button class="option" onclick="selectAnswer('D')">
D) CT آنژیوگرافی
</button>

<br>

<button id="submit" onclick="checkAnswer()">
ثبت پاسخ
</button>

<div id="result" class="hidden">

<p id="answer"></p>

<p id="explanation"></p>

</div>

</div>

</div>


<script>

let selectedAnswer = null;


function startStroke() {

document.getElementById("topics").classList.add("hidden");

document.getElementById("stroke").classList.remove("hidden");

}


function selectAnswer(answer) {

selectedAnswer = answer;

}


function checkAnswer() {

if (selectedAnswer === null) {

alert("لطفاً ابتدا یک گزینه را انتخاب کنید.");

return;

}


document.getElementById("result").classList.remove("hidden");


if (selectedAnswer === "B") {

document.getElementById("answer").textContent =
"✅ پاسخ صحیح است";

document.getElementById("explanation").textContent =
"CT اسکن بدون کنتراست معمولاً بررسی اولیه برای رد خونریزی داخل جمجمه در سکته مغزی حاد است.";

}

else {

document.getElementById("answer").textContent =
"❌ پاسخ نادرست است";

document.getElementById("explanation").textContent =
"پاسخ صحیح: B) CT اسکن بدون کنتراست.";

}

}

</script>

</body>

</html>
