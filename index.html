<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neurology Exam</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #eef8f0;
    color: #26332a;
}

.container {
    width: 94%;
    max-width: 1100px;
    margin: 25px auto;
}

/* ---------------- HEADER ---------------- */

.header {
    background: white;
    border-radius: 18px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    margin-bottom: 22px;
}

.header h1 {
    margin: 0 0 8px 0;
    font-size: 30px;
    color: #23613a;
    font-weight: 500;
}

.header p {
    margin: 0;
    color: #68736b;
    font-size: 15px;
}

/* ---------------- CHAPTERS ---------------- */

#chaptersPage h2 {
    text-align: center;
    color: #315c3d;
    font-weight: 500;
    margin: 20px 0;
}

.topics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 15px;
}

.topic {
    border: none;
    background: white;
    border-radius: 15px;
    padding: 18px;
    cursor: pointer;
    text-align: right;
    box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    transition: 0.2s;
    width: 100%;
}

.topic:hover {
    transform: translateY(-3px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.12);
}

.topic-icon {
    font-size: 28px;
    margin-bottom: 8px;
}

.topic-title {
    font-size: 16px;
    color: #244f32;
    font-weight: 500;
    margin-bottom: 7px;
}

.topic-count {
    font-size: 13px;
    color: #56805f;
}

.topic-count.empty {
    color: #999;
}

/* ---------------- EXAM PAGE ---------------- */

#examPage {
    display: none;
}

.exam-top {
    background: white;
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 15px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.07);
}

.exam-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.exam-title {
    color: #285d39;
    font-size: 17px;
    font-weight: 500;
}

.progress {
    color: #68736b;
    font-size: 14px;
}

/* ---------------- QUESTION ---------------- */

.question-card {
    background: white;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.question-number {
    color: #4e7a58;
    font-size: 14px;
    margin-bottom: 12px;
}

.question-text {
    font-size: 18px;
    line-height: 2;
    font-weight: 500;
    color: #25362a;
    margin-bottom: 20px;
}

/* ---------------- OPTIONS ---------------- */

.options {
    display: flex;
    flex-direction: column;
    gap: 11px;
}

.option {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 14px;
    border: 1px solid #d9e5dc;
    border-radius: 12px;
    background: #f8fcf9;
    cursor: pointer;
    transition: 0.2s;
}

.option:hover {
    background: #f0f8f2;
}

.option input {
    margin-top: 5px;
    width: 18px;
    height: 18px;
    cursor: pointer;
    flex-shrink: 0;
}

.option-text {
    line-height: 1.8;
    font-size: 15px;
}

/* correct / wrong */

.option.correct-option {
    background: #e6f6e9;
    border-color: #58a568;
}

.option.wrong-option {
    background: #fff0f0;
    border-color: #d86666;
}

.option.correct-option .option-text {
    color: #26733a;
}

.option.wrong-option .option-text {
    color: #a52f2f;
}

/* ---------------- RESULT ---------------- */

.result {
    display: none;
    margin-top: 18px;
    padding: 15px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.9;
}

.result.correct {
    display: block;
    background: #e7f7ea;
    color: #26733a;
    border: 1px solid #9ed0a6;
}

.result.wrong {
    display: block;
    background: #fff0f0;
    color: #a52f2f;
    border: 1px solid #e1aaaa;
}

.result-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 6px;
}

/* ---------------- EXPLANATION ---------------- */

.explanation {
    margin-top: 15px;
    padding: 15px;
    background: #f3f8f4;
    border-right: 4px solid #6c9d76;
    border-radius: 10px;
    line-height: 2;
    font-size: 14px;
}

.note {
    margin-top: 10px;
    padding: 13px;
    background: #fffbea;
    border-right: 4px solid #d5b95b;
    border-radius: 10px;
    line-height: 2;
    font-size: 13px;
}

/* ---------------- BUTTONS ---------------- */

.buttons {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 20px;
}

.btn {
    border: none;
    border-radius: 10px;
    padding: 12px 22px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    transition: 0.2s;
}

.btn:hover {
    transform: translateY(-1px);
}

.btn-check {
    background: #4d8b5b;
    color: white;
}

.btn-next {
    background: #3e6d4b;
    color: white;
}

.btn-back {
    background: #e7eee9;
    color: #36533e;
}

.btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
}

/* ---------------- SCORE ---------------- */

.score-box {
    display: none;
    background: white;
    border-radius: 18px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.score-box h2 {
    color: #2e6540;
    font-weight: 500;
}

.final-score {
    font-size: 35px;
    color: #39754a;
    margin: 20px;
}

/* ---------------- MOBILE ---------------- */

@media (max-width: 600px) {

    .container {
        width: 96%;
        margin: 12px auto;
    }

    .header h1 {
        font-size: 24px;
    }

    .question-card {
        padding: 17px;
    }

    .question-text {
        font-size: 16px;
    }

    .buttons {
        flex-direction: column;
    }

    .btn {
        width: 100%;
    }
}

</style>
</head>

<!-- =====================================================
     QUESTION BANKS
     هر فصل بانک سؤال مستقل خودش را دارد
===================================================== -->

<script src="questions.js"></script>

<script src="viral-prion-questions.js"></script>


<script>

/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentQuestions = [];

let currentQuestionIndex = 0;

let score = 0;

let answered = false;

let currentTopic = "";


/* =====================================================
   TOPIC START
===================================================== */

function startTopic(topic) {

    currentTopic = topic;

    currentQuestionIndex = 0;

    score = 0;

    answered = false;


    /*
     * هر فصل بانک سؤال مستقل خودش را دارد.
     *
     * برای اضافه کردن فصل‌های آینده فقط یک خط
     * مشابه این قسمت اضافه خواهد شد.
     */


    if (topic === "Cerebrovascular Diseases") {

        currentQuestions =
            typeof cerebrovascularQuestions !== "undefined"
            ? cerebrovascularQuestions
            : [];

    }


    else if (topic === "Viral & Prion Diseases") {

        currentQuestions =
            typeof viralPrionQuestions !== "undefined"
            ? viralPrionQuestions
            : [];

    }


    /*
     * فصل‌های آینده
     *
     * مثال:
     *
     * else if (topic === "Epilepsy & Seizure") {
     *     currentQuestions = epilepsyQuestions;
     * }
     */


    else if (topic === "Epilepsy & Seizure") {

        if (typeof epilepsyQuestions !== "undefined") {
            currentQuestions = epilepsyQuestions;
        } else {
            currentQuestions = [];
        }

    }


    else {

        currentQuestions = [];

    }


    /* اگر فصل هنوز سؤال ندارد */

    if (!currentQuestions || currentQuestions.length === 0) {

        alert(
            "بانک سؤال این فصل هنوز آماده نشده است."
        );

        return;

    }


    document.getElementById("chaptersPage")
        .style.display = "none";

    document.getElementById("examPage")
        .style.display = "block";

    document.getElementById("scoreBox")
        .style.display = "none";


    document.getElementById("examTitle")
        .textContent = getTopicTitle(topic);


    showQuestion();

}


/* =====================================================
   TOPIC TITLES
===================================================== */

function getTopicTitle(topic) {

    const titles = {

        "Cerebrovascular Diseases":
            "بیماری‌های عروق مغزی",

        "Epilepsy & Seizure":
            "صرع و تشنج",

        "Movement Disorders":
            "اختلالات حرکتی",

        "Multiple Sclerosis & Demyelinating Diseases":
            "MS و بیماری‌های دمیلینه‌کننده",

        "Neuromuscular Diseases":
            "بیماری‌های نوروماسکولار",

        "Headache & Facial Pain":
            "سردرد و دردهای صورت",

        "Dementia & Cognitive Disorders":
            "دمانس و اختلالات شناختی",

        "Viral & Prion Diseases":
            "بیماری‌های ویروسی و پریونی",

        "Neuroimmunology":
            "نورواِمیونولوژی",

        "Neuro-oncology":
            "نوروانکولوژی",

        "Neurogenetics & Metabolic Disorders":
            "بیماری‌های نوروجنتیک و متابولیک",

        "Spinal Cord Disorders":
            "بیماری‌های نخاع",

        "Neuro-ophthalmology":
            "نوروافتالمولوژی",

        "Neuro-otology":
            "نورواتولوژی",

        "Pediatric Neurology":
            "نورولوژی کودکان",

        "Neurocritical Care":
            "نورولوژی مراقبت‌های ویژه",

        "Neurotrauma":
            "نوروتروما",

        "Autonomic & Sleep Disorders":
            "اختلالات اتونوم و خواب",

        "Neurodiagnostic Methods":
            "روش‌های تشخیصی نورولوژی",

        "Neuropharmacology & Principles of Treatment":
            "نوروفارماکولوژی و اصول درمان"

    };

    return titles[topic] || topic;

}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion() {

    if (!currentQuestions.length) {
        return;
    }


    answered = false;


    const question =
        currentQuestions[currentQuestionIndex];


    document.getElementById("questionNumber")
        .textContent =
        "سؤال " +
        (currentQuestionIndex + 1);


    document.getElementById("progressText")
        .textContent =
        "سؤال " +
        (currentQuestionIndex + 1) +
        " از " +
        currentQuestions.length;


    document.getElementById("questionText")
        .textContent =
        question.question;


    const optionsContainer =
        document.getElementById("optionsContainer");


    optionsContainer.innerHTML = "";


    question.options.forEach(
        function(optionText, index) {

            const label =
                document.createElement("label");

            label.className = "option";


            const input =
                document.createElement("input");

            input.type = "radio";

            input.name = "answer";

            input.value = index;


            const span =
                document.createElement("span");

            span.className = "option-text";

            span.textContent =
                optionText;


            label.appendChild(input);

            label.appendChild(span);

            optionsContainer.appendChild(label);

        }
    );


    /* reset result */

    const resultBox =
        document.getElementById("resultBox");

    resultBox.style.display = "none";

    resultBox.className = "result";


    document.getElementById("resultTitle")
        .textContent = "";


    document.getElementById("resultMessage")
        .textContent = "";


    /* explanation */

    document.getElementById("explanationBox")
        .style.display = "none";


    document.getElementById("explanationText")
        .textContent = "";


    /* note */

    document.getElementById("noteBox")
        .style.display = "none";


    document.getElementById("noteText")
        .textContent = "";


    /* buttons */

    document.getElementById("checkButton")
        .disabled = false;


    document.getElementById("nextButton")
        .disabled = true;

}


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer() {

    if (answered) {
        return;
    }


    const selected =
        document.querySelector(
            'input[name="answer"]:checked'
        );


    if (!selected) {

        alert(
            "لطفاً ابتدا یک گزینه را انتخاب کنید."
        );

        return;

    }


    answered = true;


    const selectedIndex =
        parseInt(selected.value);


    const question =
        currentQuestions[currentQuestionIndex];


    const options =
        document.querySelectorAll(".option");


    /* correct answer */

    options[question.correct]
        .classList.add("correct-option");


    /* selected answer */

    if (selectedIndex === question.correct) {

        score++;


        options[selectedIndex]
            .classList.add("correct-option");


        showResult(
            true,
            "عالی",
            "پاسخ شما صحیح است."
        );

    }


    else {

        options[selectedIndex]
            .classList.add("wrong-option");


        showResult(
            false,
            "پاسخ غلط است",
            "پاسخ صحیح با علامت سبز مشخص شده است."
        );

    }


    /* explanation */

    if (question.explanation) {

        document.getElementById(
            "explanationBox"
        ).style.display = "block";


        document.getElementById(
            "explanationText"
        ).textContent =
            question.explanation;

    }


    /* note */

    if (question.note) {

        document.getElementById(
            "noteBox"
        ).style.display = "block";


        document.getElementById(
            "noteText"
        ).textContent =
            question.note;

    }


    /* disable answers */

    const inputs =
        document.querySelectorAll(
            'input[name="answer"]'
        );


    inputs.forEach(function(input) {

        input.disabled = true;

    });


    document.getElementById("checkButton")
        .disabled = true;


    document.getElementById("nextButton")
        .disabled = false;


    /* آخرین سؤال */

    if (
        currentQuestionIndex ===
        currentQuestions.length - 1
    ) {

        document.getElementById("nextButton")
            .textContent = "نمایش نتیجه";

    }

}


/* =====================================================
   RESULT MESSAGE
===================================================== */

function showResult(
    isCorrect,
    title,
    message
) {

    const resultBox =
        document.getElementById("resultBox");


    resultBox.style.display = "block";


    if (isCorrect) {

        resultBox.className =
            "result correct";

    }

    else {

        resultBox.className =
            "result wrong";

    }


    document.getElementById("resultTitle")
        .textContent = title;


    document.getElementById("resultMessage")
        .textContent = message;

}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion() {

    if (!answered) {
        return;
    }


    if (
        currentQuestionIndex <
        currentQuestions.length - 1
    ) {

        currentQuestionIndex++;

        showQuestion();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }

    else {

        showScore();

    }

}


/* =====================================================
   FINAL SCORE
===================================================== */

function showScore() {

    document.querySelector(".question-card")
        .style.display = "none";


    document.querySelector(".exam-top")
        .style.display = "none";


    const scoreBox =
        document.getElementById("scoreBox");


    scoreBox.style.display = "block";


    const percentage =
        Math.round(
            (score / currentQuestions.length) * 100
        );


    document.getElementById("finalScore")
        .textContent =
        score +
        " از " +
        currentQuestions.length +
        "  (" +
        percentage +
        "%)";


    let message = "";


    if (percentage >= 90) {

        message =
            "عملکرد عالی 🌟";

    }

    else if (percentage >= 75) {

        message =
            "عملکرد بسیار خوب 👍";

    }

    else if (percentage >= 60) {

        message =
            "عملکرد قابل قبول؛ مرور نکات اشتباه توصیه می‌شود.";

    }

    else {

        message =
            "بهتر است این فصل را دوباره مرور کنید.";

    }


    document.getElementById("finalMessage")
        .textContent = message;

}


/* =====================================================
   BACK TO CHAPTERS
===================================================== */

function backToChapters() {

    document.getElementById("examPage")
        .style.display = "none";


    document.getElementById("chaptersPage")
        .style.display = "block";


    document.querySelector(".question-card")
        .style.display = "block";


    document.querySelector(".exam-top")
        .style.display = "block";


    document.getElementById("scoreBox")
        .style.display = "none";


    currentQuestions = [];

    currentQuestionIndex = 0;

    score = 0;

    answered = false;

}


/* =====================================================
   END
===================================================== */

</script>

</body>
</html>
