<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NeuroPrep</title>

<style>

/* =========================================================
   تنظیمات پایه
========================================================= */

* {
    box-sizing: border-box;
}

html {
    direction: rtl;
}

body {
    margin: 0;
    padding: 0;

    background: #f4f6f8;

    color: #263238;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    text-align: center;
}


/* =========================================================
   متن فارسی و انگلیسی
========================================================= */

.rtl-text {
    direction: rtl;
    unicode-bidi: isolate;
    text-align: right;
}

.ltr {
    direction: ltr;
    unicode-bidi: isolate;
    display: inline;
    font-family:
        Arial,
        Tahoma,
        sans-serif;
}


/* =========================================================
   Header
========================================================= */

header {
    background: #1f4e79;

    color: white;

    padding: 22px 15px;
}

header h1 {
    margin: 0 0 8px 0;

    font-size: 28px;

    font-weight: 600;
}

header p {
    margin: 0;

    font-size: 16px;

    font-weight: 400;
}


/* =========================================================
   Container
========================================================= */

.container {
    width: 94%;
    max-width: 760px;

    margin: 25px auto;

    background: white;

    padding: 25px;

    border-radius: 14px;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.08);
}


/* =========================================================
   عنوان‌ها
========================================================= */

h2 {
    font-weight: 500;
}

h3 {
    font-weight: 400;
}


/* =========================================================
   فصل‌ها
========================================================= */

.topic {
    display: block;

    width: 90%;

    margin: 12px auto;

    padding: 15px;

    background: #1f4e79;

    color: white;

    border: none;

    border-radius: 9px;

    cursor: pointer;

    font-size: 17px;

    font-family: inherit;

    transition: 0.2s;
}

.topic:hover {
    background: #163b5c;
}


/* =========================================================
   اطلاعات سؤال
========================================================= */

.question-info {

    display: flex;

    justify-content: space-between;

    align-items: center;

    background: #f1f5f8;

    padding: 10px 14px;

    border-radius: 8px;

    margin-bottom: 18px;

    font-size: 14px;
}

#questionNumber {
    font-weight: 600;
}

#score {
    color: #1f4e79;

    font-weight: 600;
}


/* =========================================================
   متن سؤال
========================================================= */

#questionText {

    direction: rtl;

    unicode-bidi: isolate;

    text-align: right;

    font-size: 19px;

    line-height: 2.2;

    font-weight: 400;

    margin: 20px 5px 25px;
}


/* =========================================================
   گزینه‌ها
========================================================= */

.option {

    display: flex;

    align-items: flex-start;

    width: 96%;

    margin: 11px auto;

    padding: 14px 14px;

    /*
       سبز بسیار کمرنگ
       مطابق درخواست شما
    */
    background: #f2f8f3;

    border: 1px solid #d9e6dc;

    border-radius: 9px;

    cursor: pointer;

    text-align: right;

    font-family: inherit;

    font-size: 16px;

    font-weight: 300;

    line-height: 1.9;

    color: #263238;

    transition: 0.2s;
}

.option:hover {
    background: #eaf4ec;
}


/* =========================================================
   مربع انتخاب
========================================================= */

.option-box {

    width: 23px;

    height: 23px;

    min-width: 23px;

    border: 1.7px solid #718078;

    border-radius: 4px;

    margin-left: 12px;

    margin-top: 2px;

    background: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 16px;

    font-family: Arial, sans-serif;

    direction: ltr;

}


/* متن گزینه */

.option-text {

    direction: rtl;

    unicode-bidi: isolate;

    text-align: right;

    flex: 1;

}


/* =========================================================
   گزینه انتخاب شده
========================================================= */

.option.selected {

    background: #e5f0e7;

    border: 2px solid #6d9674;
}

.option.selected .option-box {

    border-color: #5d8264;

    background: #5d8264;

    color: white;
}


/* =========================================================
   پاسخ صحیح
========================================================= */

.option.correct {

    background: #e4f3e6;

    border: 2px solid #72a579;

    color: #285b2e;
}


/* =========================================================
   پاسخ غلط
========================================================= */

.option.wrong {

    background: #fbeaea;

    border: 2px solid #d48a8a;

    color: #8a2929;
}


/* =========================================================
   دکمه‌ها
========================================================= */

button {

    padding: 12px 20px;

    margin: 8px;

    border: none;

    border-radius: 8px;

    cursor: pointer;

    font-size: 16px;

    font-family: inherit;
}


#submit {

    background: #1f4e79;

    color: white;

    min-width: 130px;
}


#submit:hover {
    background: #163b5c;
}


#next {

    background: #527d59;

    color: white;

    min-width: 130px;
}


#next:hover {
    background: #416747;
}


.back-button {

    background: #777;

    color: white;

    min-width: 130px;
}


/* =========================================================
   نتیجه سؤال
========================================================= */

#result {

    margin-top: 22px;

    padding: 18px;

    background: #f7faf8;

    border-radius: 10px;

    text-align: right;

    line-height: 2;

    border-right: 4px solid #1f4e79;
}


#answer {

    font-size: 18px;

    font-weight: 600;

    margin-top: 0;
}


#explanation {

    font-size: 15px;

    font-weight: 300;

    color: #455a64;

    line-height: 2.1;
}


/* =========================================================
   نتیجه نهایی
========================================================= */

#finalResult {

    padding: 25px;

    background: #f1f7f2;

    border-radius: 12px;

    line-height: 2;
}


#finalResult h2 {

    color: #315f38;

    font-weight: 500;
}


/* =========================================================
   مخفی
========================================================= */

.hidden {
    display: none !important;
}


/* =========================================================
   نمایش قطعه انگلیسی
========================================================= */

.medical-term {

    direction: ltr;

    unicode-bidi: isolate;

    display: inline-block;

    font-family:
        Arial,
        sans-serif;
}


/* =========================================================
   موبایل
========================================================= */

@media (max-width: 600px) {

    .container {

        width: 95%;

        padding: 16px;

        margin: 15px auto;
    }


    header h1 {
        font-size: 24px;
    }


    #questionText {
        font-size: 17px;

        line-height: 2.15;
    }


    .option {

        width: 100%;

        font-size: 15px;

        padding: 12px 10px;
    }


    .question-info {

        font-size: 13px;
    }

}

</style>

</head>

/* =========================================================
   تابع بسیار مهم برای نمایش صحیح فارسی + انگلیسی
========================================================= */

function formatMedicalText(text) {

    /*
       کاراکترهای HTML را ابتدا ایمن می‌کنیم
       تا متن سؤال بتواند بدون مشکل نمایش داده شود.
    */

    let safeText = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");


    /*
       تشخیص کلمات انگلیسی،
       اعداد و ترکیبات پزشکی
    */

    safeText = safeText.replace(

        /([A-Za-z]+(?:[A-Za-z0-9+\-./=()]*[A-Za-z0-9)])?)/g,

        function(match) {

            if (!match.trim()) {
                return match;
            }

            return '<span class="medical-term">'
                 + match
                 + '</span>';
        }

    );


    return safeText;
}
