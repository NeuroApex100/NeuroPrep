<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>آزمون نورولوژی</title>

<style>

/* =====================================================
   تنظیمات پایه
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Tahoma, Arial, sans-serif;
    background: #eef7f1;
    color: #26352d;
    line-height: 1.9;
}

/* =====================================================
   کانتینر اصلی
===================================================== */

.container {
    max-width: 920px;
    margin: 25px auto;
    background: #ffffff;
    padding: 32px;
    border-radius: 18px;
    box-shadow: 0 5px 25px rgba(40, 80, 55, 0.10);
}

/* =====================================================
   عنوان اصلی
===================================================== */

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
    font-size: 30px;
    color: #245c43;
    font-weight: 500;
}

.header-subtitle {
    margin-top: 8px;
    color: #718078;
    font-size: 15px;
}

.header-line {
    width: 80px;
    height: 3px;
    background: #79b893;
    margin: 15px auto 0;
    border-radius: 10px;
}

/* =====================================================
   صفحه فصول
===================================================== */

#topicsPage {
    display: block;
}

.topics-title {
    text-align: center;
    color: #315a47;
    font-size: 22px;
    font-weight: 500;
    margin: 10px 0 25px;
}

/* =====================================================
   شبکه فصل ها
===================================================== */

.topics-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

/* =====================================================
   کارت فصل
===================================================== */

.topic {
    width: 100%;
    min-height: 105px;

    border: 1px solid #d9e8df;
    border-radius: 14px;

    background: #f8fcf9;

    padding: 17px 18px;

    cursor: pointer;

    text-align: right;

    transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease,
        border-color 0.18s ease;

    position: relative;
}

.topic:hover {
    background: #f1faf4;
    border-color: #a8ceb8;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(45, 100, 70, 0.10);
}

.topic.has-questions {
    border-right: 5px solid #55a876;
}

.topic-icon {
    display: inline-flex;
    width: 38px;
    height: 38px;

    align-items: center;
    justify-content: center;

    background: #e7f4eb;
    border-radius: 10px;

    font-size: 20px;

    vertical-align: middle;
    margin-left: 8px;
}

.topic-name {
    display: inline-block;
    vertical-align: middle;
}

.topic-name-en {
    font-size: 16px;
    color: #315a47;
    font-weight: 500;
}

.topic-name-fa {
    font-size: 14px;
    color: #718078;
    margin-top: 3px;
}

.topic-count {
    position: absolute;
    left: 14px;
    bottom: 12px;

    padding: 3px 9px;

    border-radius: 20px;

    background: #e7f4eb;
    color: #397453;

    font-size: 12px;
}

.topic-count.empty {
    background: #f1f3f2;
    color: #8a938e;
}

/* =====================================================
   صفحه آزمون
===================================================== */

#examPage {
    display: none;
}

.exam-header {
    margin-bottom: 20px;
}

.exam-topic-title {
    margin: 0 0 5px;
    font-size: 23px;
    color: #285e45;
    font-weight: 500;
}

.exam-topic-subtitle {
    color: #78847e;
    font-size: 14px;
}

/* =====================================================
   نوار وضعیت
===================================================== */

.exam-status {
    background: #f5faf7;
    border: 1px solid #dcebe2;
    border-radius: 12px;

    padding: 15px 17px;
    margin-bottom: 22px;
}

.status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 10px;

    font-size: 14px;
    color: #5d6c64;
}

#questionNumber {
    font-weight: bold;
    color: #315f49;
}

.progress-container {
    width: 100%;
    height: 9px;

    background: #dfeae3;

    border-radius: 20px;
    overflow: hidden;
}

#progressBar {
    height: 100%;
    width: 0%;

    background: #69aa82;

    border-radius: 20px;

    transition: width 0.3s ease;
}

/* =====================================================
   منبع سؤال
===================================================== */

.question-source {
    display: inline-block;

    margin-bottom: 18px;

    padding: 4px 10px;

    border-radius: 7px;

    background: #f2f5f3;

    color: #6d7872;

    font-size: 13px;
}

/* =====================================================
   متن سؤال
===================================================== */

.question {
    background: #f7fbf8;

    border-right: 4px solid #78b38e;

    padding: 20px 22px;

    border-radius: 12px;

    font-size: 18px;

    line-height: 2.25;

    margin-bottom: 22px;

    color: #26352d;
}

/* جلوگیری از به هم ریختن انگلیسی */

.english {
    direction: ltr;
    unicode-bidi: isolate;

    display: inline-block;

    font-family: Arial, sans-serif;

    white-space: normal;
}

/* =====================================================
   گزینه ها
===================================================== */

#optionsContainer {
    margin-top: 10px;
}

.option {
    display: flex;

    align-items: flex-start;

    gap: 12px;

    padding: 15px 17px;

    margin: 10px 0;

    border: 1px solid #dce4df;

    border-radius: 11px;

    cursor: pointer;

    background: #ffffff;

    line-height: 1.9;

    transition:
        background 0.18s ease,
        border-color 0.18s ease,
        transform 0.12s ease;
}

.option:hover {
    background: #f7fbf8;
    border-color: #a9cdb7;
    transform: translateX(-2px);
}

.option input {
    margin-top: 7px;

    width: 18px;
    height: 18px;

    flex-shrink: 0;

    accent-color: #4f9a6d;
}

.option-letter {
    font-weight: bold;
    color: #49665a;
    min-width: 25px;
}

.option-text {
    flex: 1;
}

/* پاسخ صحیح */

.option.correct-option {
    background: #e4f7e9 !important;
    border: 2px solid #4caf70 !important;
    color: #245c39;
}

/* پاسخ غلط */

.option.wrong-option {
    background: #fde9e8 !important;
    border: 2px solid #df6661 !important;
    color: #8c302d;
}

/* =====================================================
   دکمه ها
===================================================== */

.button-row {
    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-top: 22px;
}

button {
    font-family: inherit;

    border: none;

    border-radius: 9px;

    cursor: pointer;

    transition:
        opacity 0.18s ease,
        transform 0.12s ease;
}

button:hover {
    opacity: 0.92;
}

button:active {
    transform: scale(0.98);
}

#submitButton {
    background: #3e8c60;
    color: white;

    padding: 12px 28px;

    font-size: 16px;
}

#nextButton {
    background: #2779b7;
    color: white;

    padding: 12px 28px;

    font-size: 16px;

    display: none;
}

#backButton {
    background: #7b8781;
    color: white;

    padding: 12px 22px;

    font-size: 15px;
}

/* =====================================================
   نتیجه
===================================================== */

#result {
    margin-top: 25px;

    padding: 22px;

    border-radius: 13px;

    display: none;

    line-height: 2.15;
}

#result.correct {
    background: #e6f7eb;
    border: 1px solid #b8dfc4;
}

#result.wrong {
    background: #fdebea;
    border: 1px solid #efc2c0;
}

.result-title {
    font-size: 19px;

    font-weight: bold;

    margin-bottom: 10px;
}

#result.correct .result-title {
    color: #267443;
}

#result.wrong .result-title {
    color: #a73834;
}

/* =====================================================
   توضیح
===================================================== */

.explanation-box {
    margin-top: 16px;

    padding-top: 14px;

    border-top: 1px solid rgba(0,0,0,0.08);
}

/* =====================================================
   نکته آزمونی
===================================================== */

.note-box {
    margin-top: 18px;

    padding: 14px 16px;

    background: #f0f8f2;

    border-right: 4px solid #71a984;

    border-radius: 9px;
}

/* =====================================================
   تله آزمونی
===================================================== */

.trap-box {
    margin-top: 18px;

    padding: 14px 16px;

    background: #fff7ed;

    border-right: 4px solid #e2a15e;

    border-radius: 9px;
}

/* =====================================================
   صفحه پایان فصل
===================================================== */

#finalResult {
    display: none;

    margin-top: 25px;

    padding: 28px;

    text-align: center;

    border-radius: 15px;

    background: #eef9f1;

    border: 1px solid #c7e5cf;
}

.final-title {
    font-size: 23px;

    color: #2e7248;

    margin-bottom: 15px;
}

.final-score {
    font-size: 38px;

    font-weight: bold;

    color: #397f53;

    margin: 10px 0;
}

.final-message {
    color: #637169;

    margin-bottom: 20px;
}

/* =====================================================
   دکمه بازگشت پایان آزمون
===================================================== */

.final-buttons {
    display: flex;

    justify-content: center;

    gap: 10px;

    flex-wrap: wrap;
}

.final-buttons button {
    padding: 12px 25px;

    font-size: 15px;
}

.restart-button {
    background: #3e8c60;

    color: white;
}

.topics-button {
    background: #6f7e76;

    color: white;
}

/* =====================================================
   جداکننده
===================================================== */

.section-divider {
    height: 1px;

    background: #e2ebe5;

    margin: 25px 0;
}

/* =====================================================
   موبایل
===================================================== */

@media (max-width: 700px) {

    body {
        padding: 8px;
    }

    .container {
        margin: 8px auto;

        padding: 18px;

        border-radius: 14px;
    }

    .header h1 {
        font-size: 25px;
    }

    .topics-grid {
        grid-template-columns: 1fr;
    }

    .topic {
        min-height: 95px;
    }

    .question {
        font-size: 17px;

        padding: 17px;

        line-height: 2.1;
    }

    .option {
        font-size: 15px;

        padding: 13px;
    }

    .button-row {
        flex-direction: column;
    }

    #submitButton,
    #nextButton,
    #backButton {
        width: 100%;
    }

    .status-row {
        font-size: 13px;
    }
}

</style>

</head>

             class="note-box">
        </div>


        <div id="trapBox"
             class="trap-box">
        </div>


    </div>


    <!-- =================================================
         نتیجه نهایی فصل
    ================================================== -->

    <div id="finalResult">


        <div class="final-title">
            🎓 پایان این مبحث
        </div>


        <div class="final-message">
            نتیجه شما در این مجموعه:
        </div>


        <div id="finalScore"
             class="final-score">
        </div>


        <div id="finalMessage"
             class="final-message">
        </div>


        <div class="final-buttons">


            <button
                class="restart-button"
                onclick="restartTopic()">

                🔄 شروع دوباره

            </button>


            <button
                class="topics-button"
                onclick="backToTopics()">

                📚 انتخاب مبحث دیگر

            </button>


        </div>


    </div>


</div>


</div>


<!-- =====================================================
     بانک سؤالات
===================================================== -->

<script src="questions.js"></script>


<script>

/* =====================================================
   متغیرهای اصلی
===================================================== */

let currentTopic = "";

let currentQuestions = [];

let currentQuestionIndex = 0;

let answered = false;

let correctAnswers = 0;


/* =====================================================
   تبدیل اعداد انگلیسی به فارسی
===================================================== */

function toPersianNumber(number) {

    const numbers = [
        "۰","۱","۲","۳","۴",
        "۵","۶","۷","۸","۹"
    ];

    return String(number)
        .replace(/\d/g, function(digit) {
            return numbers[digit];
        });

}


/* =====================================================
   شروع یک مبحث
===================================================== */

function startTopic(topic) {

    currentTopic = topic;

    currentQuestionIndex = 0;

    correctAnswers = 0;

    answered = false;


    /* انتخاب بانک سؤال */

    if (topic === "Cerebrovascular Diseases") {

        currentQuestions = cerebrovascularQuestions;

    }

    else if (topic === "Epilepsy & Seizure") {

        currentQuestions = [];

    }

    else if (topic === "Movement Disorders") {

        currentQuestions = [];

    }

    else if (
        topic ===
        "Multiple Sclerosis & Demyelinating Diseases"
    ) {

        currentQuestions = [];

    }

    else if (topic === "Neuromuscular Diseases") {

        currentQuestions = [];

    }

    else if (topic === "Headache & Facial Pain") {

        currentQuestions = [];

    }

    else if (
        topic ===
        "Dementia & Cognitive Disorders"
    ) {

        currentQuestions = [];

    }

    else if (topic === "Neuroinfectious Diseases") {

        currentQuestions = [];

    }

    else if (topic === "Neuroimmunology") {

        currentQuestions = [];

    }

    else if (topic === "Neuro-oncology") {

        currentQuestions = [];

    }

    else if (
        topic ===
        "Neurogenetics & Metabolic Disorders"
    ) {

        currentQuestions = [];

    }

    else if (topic === "Spinal Cord Disorders") {

        currentQuestions = [];

    }

    else if (topic === "Neuro-ophthalmology") {

        currentQuestions = [];

    }

    else if (topic === "Neuro-otology") {

        currentQuestions = [];

    }

    else if (topic === "Pediatric Neurology") {

        currentQuestions = [];

    }

    else if (topic === "Neurocritical Care") {

        currentQuestions = [];

    }

    else if (topic === "Neurotrauma") {

        currentQuestions = [];

    }

    else if (
        topic ===
        "Autonomic & Sleep Disorders"
    ) {

        currentQuestions = [];

    }

    else if (topic === "Neurodiagnostic Methods") {

        currentQuestions = [];

    }

    else if (
        topic ===
        "Neuropharmacology & Principles of Treatment"
    ) {

        currentQuestions = [];

    }

    else {

        currentQuestions = [];

    }


    /* تغییر صفحه */

    document.getElementById("topicsPage")
        .style.display = "none";

    document.getElementById("examPage")
        .style.display = "block";


    document.getElementById("topicTitle")
        .textContent = topic;


    /* اگر سؤال نداریم */

    if (currentQuestions.length === 0) {

        document.getElementById("questionNumber")
            .textContent = "";

        document.getElementById("questionSource")
            .textContent = "";

        document.getElementById("questionText")
            .innerHTML =
            `
            <div style="text-align:center;padding:25px;">
                📚
                <br><br>
                در حال حاضر سؤالی برای این مبحث
                وارد نشده است.
                <br><br>
                <span style="font-size:14px;color:#7a857f;">
                    بانک این فصل به‌تدریج تکمیل خواهد شد.
                </span>
            </div>
            `;

        document.getElementById("optionsContainer")
            .innerHTML = "";

        document.getElementById("submitButton")
            .style.display = "none";

        document.getElementById("nextButton")
            .style.display = "none";

        document.getElementById("result")
            .style.display = "none";

        document.getElementById("finalResult")
            .style.display = "none";

        document.getElementById("progressBar")
            .style.width = "0%";

        return;
    }


    document.getElementById("submitButton")
        .style.display = "inline-block";


    document.getElementById("finalResult")
        .style.display = "none";


    showQuestion();

}


/* =====================================================
   نمایش سؤال
===================================================== */

function showQuestion() {

    answered = false;


    const question =
        currentQuestions[currentQuestionIndex];


    /* شماره سؤال */

    document.getElementById("questionNumber")
        .textContent =
        "سؤال " +
        toPersianNumber(currentQuestionIndex + 1) +
        " از " +
        toPersianNumber(currentQuestions.length);


    /* امتیاز */

    document.getElementById("scoreDisplay")
        .textContent =
        "امتیاز: " +
        toPersianNumber(correctAnswers);


    /* نوار پیشرفت */

    const progress =
        (
            (currentQuestionIndex + 1) /
            currentQuestions.length
        ) * 100;


    document.getElementById("progressBar")
        .style.width = progress + "%";


    /* منبع */

    document.getElementById("questionSource")
        .textContent =
        question.source
        ? "(" + question.source + ")"
        : "";


    /* متن سؤال */

    document.getElementById("questionText")
        .innerHTML =
        question.question;


    /* گزینه ها */

    const optionsContainer =
        document.getElementById("optionsContainer");


    optionsContainer.innerHTML = "";


    question.options.forEach(
        function(option, index) {


            const label =
                document.createElement("label");


            label.className = "option";


            label.innerHTML = `

                <input
                    type="radio"
                    name="answer"
                    value="${index}"
                >

                <span class="option-letter">
                    ${String.fromCharCode(65 + index)})
                </span>

                <span class="option-text">
                    ${option}
                </span>

            `;


            optionsContainer.appendChild(label);

        }
    );


    /* پاک کردن نتیجه قبلی */

    document.getElementById("result")
        .style.display = "none";


    document.getElementById("result")
        .className = "";


    document.getElementById("nextButton")
        .style.display = "none";


    document.getElementById("submitButton")
        .style.display = "inline-block";


    document.getElementById("finalResult")
        .style.display = "none";

}


/* =====================================================
   بررسی پاسخ
===================================================== */

function checkAnswer() {


    if (answered) {

        return;

    }


    const selected =
        document.querySelector(
            'input[name="answer"]:checked'
        );


    if (!selected) {

        alert(
            "لطفاً ابتدا یک گزینه را انتخاب کنید."
        );

        return;

    }


    answered = true;


    const selectedIndex =
        Number(selected.value);


    const question =
        currentQuestions[currentQuestionIndex];


    const optionLabels =
        document.querySelectorAll(".option");


    /* مشخص کردن پاسخ ها */

    optionLabels.forEach(
        function(label, index) {


            label.style.pointerEvents =
                "none";


            /* پاسخ صحیح */

            if (
                index ===
                question.correct
            ) {

                label.classList.add(
                    "correct-option"
                );

            }


            /* پاسخ غلط انتخاب شده */

            if (
                index === selectedIndex &&
                selectedIndex !== question.correct
            ) {

                label.classList.add(
                    "wrong-option"
                );

            }

        }
    );


    const result =
        document.getElementById("result");


    const resultTitle =
        document.getElementById("resultTitle");


    /* =================================================
       پاسخ صحیح
    ================================================= */

    if (
        selectedIndex ===
        question.correct
    ) {

        correctAnswers++;


        result.className = "correct";


        resultTitle.innerHTML =
            "✅ عالی! پاسخ شما صحیح است.";


    }


    /* =================================================
       پاسخ غلط
    ================================================= */

    else {

        result.className = "wrong";


        resultTitle.innerHTML =
            "❌ پاسخ غلط است.";


    }


    /* توضیح */

    document.getElementById("explanationBox")
        .innerHTML =

        "<strong>📖 توضیح:</strong><br>" +

        (question.explanation || "");


    /* نکته */

    document.getElementById("noteBox")
        .innerHTML =

        "<strong>💡 نکته آزمونی:</strong><br>" +

        (question.note || "");


    /* تله */

    document.getElementById("trapBox")
        .innerHTML =

        "<strong>⚠️ تله آزمونی:</strong><br>" +

        (question.trap || "");


    /* نمایش نتیجه */

    result.style.display = "block";


    /* به‌روزرسانی امتیاز */

    document.getElementById("scoreDisplay")
        .textContent =

        "امتیاز: " +
        toPersianNumber(correctAnswers);


    /* مخفی کردن ثبت پاسخ */

    document.getElementById("submitButton")
        .style.display = "none";


    /* سؤال بعدی */

    if (
        currentQuestionIndex <
        currentQuestions.length - 1
    ) {

        document.getElementById("nextButton")
            .style.display = "inline-block";

    }

    else {

        /* آخرین سؤال */

        setTimeout(
            function() {

                showFinalResult();

            },
            500
        );

    }

}


/* =====================================================
   سؤال بعدی
===================================================== */

function nextQuestion() {


    if (
        currentQuestionIndex <
        currentQuestions.length - 1
    ) {

        currentQuestionIndex++;

        showQuestion();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }

}


/* =====================================================
   نمایش نتیجه نهایی
===================================================== */

function showFinalResult() {


    const total =
        currentQuestions.length;


    const percentage =
        Math.round(
            (correctAnswers / total) * 100
        );


    document.getElementById("result")
        .style.display = "none";


    document.getElementById("submitButton")
        .style.display = "none";


    document.getElementById("nextButton")
        .style.display = "none";


    document.getElementById("finalResult")
        .style.display = "block";


    document.getElementById("finalScore")
        .textContent =

        toPersianNumber(correctAnswers) +
        " از " +
        toPersianNumber(total) +
        "  (" +
        toPersianNumber(percentage) +
        "٪)";


    let message = "";


    if (percentage >= 90) {

        message =
            "🌟 فوق‌العاده! تسلط شما بر این مبحث بسیار خوب است.";

    }

    else if (percentage >= 75) {

        message =
            "👏 بسیار خوب! با مرور نکات غلط‌ها می‌توانید نتیجه را بهتر کنید.";

    }

    else if (percentage >= 50) {

        message =
            "👍 قابل قبول است؛ پیشنهاد می‌کنم سؤالات اشتباه را دوباره مرور کنید.";

    }

    else {

        message =
            "📚 این مبحث نیاز به مرور بیشتری دارد. نگران نباشید؛ با تکرار بهتر می‌شود.";

    }


    document.getElementById("finalMessage")
        .textContent = message;


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================================
   شروع دوباره همان فصل
===================================================== */

function restartTopic() {

    startTopic(currentTopic);

}


/* =====================================================
   بازگشت به فصول
===================================================== */

function backToTopics() {


    document.getElementById("examPage")
        .style.display = "none";


    document.getElementById("topicsPage")
        .style.display = "block";


    currentQuestions = [];

    currentQuestionIndex = 0;

    correctAnswers = 0;

    answered = false;


    document.getElementById("result")
        .style.display = "none";


    document.getElementById("finalResult")
        .style.display = "none";


    document.getElementById("progressBar")
        .style.width = "0%";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}

</script>


</body>

</html>
